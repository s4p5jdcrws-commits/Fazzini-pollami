<style>
:root{--coal:#2b2b2b;--deep:#202020;--butter:#f3e6a0;--sky:#9fc3cc;--paper:#faf5e4;--kraft:#eee3c3;--muted:#6b685a;--script:'Yellowtail','Brush Script MT',cursive;--cond:'Oswald','Arial Narrow',sans-serif;--serif:'Lora',Georgia,serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}

header{position:sticky;top:0;z-index:4;background:var(--coal);color:var(--butter);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 6%;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:3px double var(--butter)}
